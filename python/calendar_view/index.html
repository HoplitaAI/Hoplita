<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Appointments</title>
<link rel="stylesheet" href="calendar.css">
</head>
<body data-mode="month">
  <div class="bar">
    <div class="seg" id="seg" role="tablist">
      <button type="button" data-mode="month" aria-pressed="true"></button>
      <button type="button" data-mode="week" aria-pressed="false"></button>
      <button type="button" data-mode="agenda" aria-pressed="false"></button>
    </div>
    <button type="button" class="nav nav-only" id="nav-prev"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg></button>
    <span class="title nav-only" id="nav-title"></span>
    <button type="button" class="nav nav-only" id="nav-next"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg></button>
    <button type="button" class="ghost nav-only" id="today-btn"></button>
    <span class="title agenda-only" id="agenda-title" style="min-width:0;padding:0 6px"></span>
    <span class="count agenda-only" id="agenda-count"></span>
    <button type="button" class="ghost agenda-only" id="go-today"></button>
    <select class="ghost agenda-only" id="proj-filter"></select>
    <span class="spacer"></span>
    <button type="button" class="ghost" id="pending-btn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.5 5h13l3.5 7v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6z"/></svg><span id="pending-label"></span></button>
    <button type="button" class="run" id="new-btn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg><span id="new-label"></span></button>
  </div>

  <section id="month">
    <div class="wdrow" id="wdrow"></div>
    <div class="grid" id="grid"></div>
    <div class="legend" id="legend"></div>
  </section>

  <section id="week">
    <div class="wk">
      <div class="wkhead" id="wkhead"></div>
      <div class="wkbody" id="wkbody"></div>
    </div>
  </section>

  <section id="agenda"></section>

  <div id="veil"></div>
  <div id="menu" role="menu">
    <div class="mh" id="menu-title"></div>
    <div class="mi" id="menu-edit" role="menuitem"></div>
    <div class="mi danger" id="menu-delete" role="menuitem"></div>
  </div>
  <script src="calendar.js"></script>
</body>
</html>
