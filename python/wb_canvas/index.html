<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whiteboard</title>
<link rel="stylesheet" href="static/vendor/hljs-dark.min.css">
<link rel="stylesheet" href="static/style.css">
</head><body>
<div id="app">
  <header id="topbar">
    <div class="tb-left"><span class="tb-home" id="tb-home" title="All whiteboards">🧭</span>
      <span id="tb-title" class="tb-title">Whiteboard</span><span id="tb-meta" class="tb-meta"></span></div>
    <nav id="tb-views" class="tb-views"></nav>
    <div class="tb-right"><span id="tb-activity" class="tb-activity"></span></div>
  </header>
  <div id="banner" class="banner" hidden></div>
  <div id="stale" class="banner stale" hidden></div>
  <main id="main">
    <aside id="toc" class="toc"></aside>
    <section id="view-review" class="view"><article id="doc" class="doc"></article></section>
    <section id="view-commits" class="view" hidden></section>
    <section id="view-diff" class="view" hidden></section>
    <section id="view-trace" class="view" hidden></section>
    <section id="view-home" class="view" hidden></section>
  </main>
  <aside id="panel" class="panel" hidden>
    <div class="panel-head"><span id="panel-kicker" class="kicker"></span><span id="panel-title" class="panel-title"></span>
      <button id="panel-close" class="btn-ghost" title="Close (Esc)">✕</button></div>
    <div id="panel-body" class="panel-body"></div>
  </aside>
  <div id="tour" class="tour" hidden>
    <div class="tour-stage" id="tour-stage"></div>
    <div class="tour-feed"><div class="tour-head"><span id="tour-title"></span>
      <button id="tour-close" class="btn-ghost" title="Close (Esc)">✕</button></div>
      <div id="tour-steps" class="tour-steps"></div></div>
  </div>
  <button id="copy-agent" class="copy-agent" hidden>Copy for agent ⇧⌘C</button>
  <div id="toast" class="toast" hidden></div>
</div>
<script src="static/vendor/markdown-it.min.js"></script>
<script src="static/vendor/highlight.min.js"></script>
<script src="static/vendor/elk.bundled.js"></script>
<script src="static/app.js"></script>
</body></html>
