<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whiteboard</title>
<link rel="stylesheet" href="static/vendor/hljs-dark.min.css">
<link rel="stylesheet" href="static/style.css">
</head><body>
<div id="app">
  <section id="stage" class="stage">
    <header id="topbar">
      <div id="tb-normal" class="tb-row">
        <div class="navb"><button id="nav-back" aria-label="Back">&#8592;</button><button id="nav-fwd" aria-label="Forward">&#8594;</button></div>
        <nav id="tabs" class="tabs"></nav>
        <div id="tb-status" class="tb-status"></div>
      </div>
      <div id="tb-tour" class="tb-row tourbar" hidden>
        <span id="tour-kicker" class="tour-kicker"></span><span id="tour-title" class="tour-what"></span>
        <span id="tour-step" class="tour-step"></span>
        <button id="tour-prev" class="btn"></button><button id="tour-next" class="btn"></button>
        <button id="tour-close" class="btn primary"></button>
      </div>
    </header>
    <nav id="tb-views" class="views" hidden></nav>
    <div id="banner" class="banner" hidden></div>
    <main id="main">
      <aside id="toc" class="toc"></aside>
      <section id="view-review" class="view"><article id="doc" class="doc"></article></section>
      <section id="view-commits" class="view" hidden></section>
      <section id="view-diff" class="view" hidden></section>
      <section id="view-trace" class="view" hidden></section>
      <section id="view-home" class="view" hidden></section>
    </main>
    <div id="tour" class="tour" hidden>
      <div class="tour-stage" id="tour-stage"></div>
      <div class="tour-card" id="tour-card"></div>
    </div>
    <aside id="panel" class="panel" hidden>
      <div class="panel-head"><span id="panel-kicker" class="kicker"></span><span id="panel-title" class="panel-title"></span>
        <button id="panel-close" class="btn"></button></div>
      <div id="panel-body" class="panel-body"></div>
    </aside>
  </section>
  <button id="copy-agent" class="copy-agent" hidden>Copy for agent ⇧⌘C</button>
  <div id="toast" class="toast" hidden></div>
</div>
<script src="static/vendor/markdown-it.min.js"></script>
<script src="static/vendor/highlight.min.js"></script>
<script src="static/vendor/elk.bundled.js"></script>
<script src="static/app.js"></script>
</body></html>
