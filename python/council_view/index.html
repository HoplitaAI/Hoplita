<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Council</title>
<link rel="stylesheet" href="council.css">
<link rel="stylesheet" href="../wb_canvas/vendor/hljs-dark.min.css">
</head>
<body>
<main id="app">
  <header id="intro" class="intro">
    <h1 class="intro-title" data-l="title"></h1>
    <p class="intro-sub" data-l="subtitle"></p>
  </header>

  <header id="matter" class="matter" hidden>
    <div class="eyebrow" data-l="the_matter"></div>
    <h2 id="matter-text" class="matter-text"></h2>
    <details id="briefing" class="briefing" hidden>
      <summary id="briefing-head"></summary>
      <pre id="briefing-text"></pre>
    </details>
  </header>

  <div class="agora">
    <svg id="hemicycle" viewBox="0 0 820 292" role="img" aria-label="Seats of the council"></svg>
    <div class="rostrum">
      <div id="status" class="status"></div>
      <div id="ticker" class="ticker"></div>
    </div>
    <div id="bench-tools" class="bench-tools" hidden>
      <p id="bench-hint" class="bench-hint"></p>
      <p id="bench-empty" class="bench-empty" hidden></p>
      <button id="ctx-chip" class="chip" type="button" aria-pressed="true"><span class="chip-dot"></span><span id="ctx-label"></span></button>
    </div>
    <ol id="rail" class="rail" hidden></ol>
    <div class="session-tools">
      <button id="to-bench" class="chip ghost" type="button"></button>
    </div>
  </div>

  <section id="welcome" class="welcome">
    <ol class="welcome-steps">
      <li><span class="step-n">I</span><span data-l="how_1"></span></li>
      <li><span class="step-n">II</span><span data-l="how_2"></span></li>
      <li><span class="step-n">III</span><span data-l="how_3"></span></li>
      <li><span class="step-n">IV</span><span data-l="how_4"></span></li>
    </ol>
    <p class="welcome-ask" data-l="how_ask"></p>
  </section>

  <section id="session" hidden>
    <section id="verdict" class="verdict" hidden>
      <div class="verdict-head">
        <svg id="donut" class="donut" viewBox="0 0 140 140" aria-hidden="true"></svg>
        <div class="verdict-words">
          <div id="verdict-title" class="verdict-title"></div>
          <div id="verdict-sub" class="verdict-sub"></div>
          <div id="verdict-votes" class="verdict-votes"></div>
        </div>
      </div>
      <article class="final">
        <div class="final-label" data-l="final"></div>
        <div id="final-body" class="md clamp"></div>
        <button class="more" type="button" data-more="final-body"></button>
      </article>
    </section>

    <div id="notes" class="notes"></div>
    <div id="rounds" class="rounds"></div>

    <details id="activity" class="activity" hidden>
      <summary id="activity-head"></summary>
      <div id="activity-log" class="activity-log"></div>
    </details>
  </section>
</main>
<script src="../wb_canvas/vendor/markdown-it.min.js"></script>
<script src="../wb_canvas/vendor/highlight.min.js"></script>
<script src="council.js"></script>
</body>
</html>
